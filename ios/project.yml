# XcodeGen 스펙 — Mac에서 `xcodegen generate` 실행 시 SimpleScan.xcodeproj 생성.
#   설치: brew install xcodegen
#   생성: cd ios && xcodegen generate && open SimpleScan.xcodeproj
name: SimpleScan
options:
  bundleIdPrefix: com.simplescan
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "" # ← 본인 Apple Developer 팀 ID 입력 후 실기기 서명
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO

targets:
  SimpleScan:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SimpleScan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplescan.app
        # 실행 파일/번들명은 ASCII(SimpleScan), 홈 화면 표시명은 Info.plist의
        # CFBundleDisplayName(심플스캔)으로 분리.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
    info:
      path: SimpleScan/Info.plist
      properties:
        CFBundleDisplayName: 심플스캔
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "문서를 촬영해 스캔하기 위해 카메라를 사용합니다."
        # 표준 암호화만 사용 → TestFlight 업로드 시 수출 규정 질문 자동 처리.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

# 공유 스킴을 명시해 xcodebuild -scheme SimpleScan 이 항상 동작하도록.
schemes:
  SimpleScan:
    build:
      targets:
        SimpleScan: all
    run:
      config: Debug
    archive:
      config: Release
